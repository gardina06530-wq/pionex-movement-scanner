name: Pionex Scanner V3

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: "0"
        run: python scanner.py

      - name: Sauvegarder l'etat paper trading
        run: |
          git config user.name "pionex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json

          if git diff --cached --quiet; then
            echo "Aucun changement d'etat."
          else
            git commit -m "Update paper trading state"
            git push
          fi
