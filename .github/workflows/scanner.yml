name: Pionex PERPS Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: pionex-perps-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Verifier que le scanner PERPS est present
        run: |
          grep -q '"PERP"' scanner.py
          grep -q 'PIONEX PERPS' scanner.py
          echo "Scanner PERPS OK"

      - name: Verifier la syntaxe
        run: python -m py_compile scanner.py

      - name: Lancer le scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
